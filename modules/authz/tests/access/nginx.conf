daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Sync access-phase check — method allowlist gates the content handler.
        # js_content runs after js_access (access phase before content phase).
        location /access {
            js_access main.access_check;
            js_content main.ok_response;
        }

        # Async access-phase check with JSON body.
        # $authz_body_fields  — comma-separated fields to extract from JSON
        # $authz_body_required — field that must be present to allow
        location /access/json {
            set $authz_body_fields "action,resource";
            set $authz_body_required "action";
            js_access main.access_json_check;
            js_content main.ok_response;
        }

        location /access/json-misconfig {
            set $authz_body_fields "resource";
            js_access main.access_json_check;
            js_content main.ok_response;
        }

        # Async access-phase check with form body.
        location /access/form {
            set $authz_body_fields "action,resource";
            set $authz_body_required "action";
            js_access main.access_form_check;
            js_content main.ok_response;
        }

        location /access/form-misconfig {
            set $authz_body_fields "resource";
            js_access main.access_form_check;
            js_content main.ok_response;
        }
    }
}
