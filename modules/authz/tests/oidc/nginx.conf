daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Simulate $oidc_claim_* variables by reading from request headers.
        # In production the native oidc module sets these after OIDC session validation.
        location /oidc-check {
            set $oidc_claim_sub   $http_x_oidc_sub;
            set $oidc_claim_email $http_x_oidc_email;
            set $oidc_claim_name  $http_x_oidc_name;
            js_content main.oidc_check;
        }

        location /enriched-oidc-check {
            set $oidc_claim_sub   $http_x_oidc_sub;
            set $oidc_claim_email $http_x_oidc_email;
            set $oidc_claim_name  $http_x_oidc_name;
            js_content main.enriched_oidc_check;
        }
    }
}
