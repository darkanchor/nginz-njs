daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Native jwt module: verify HS256 signature, extract role claim into $jwt_claim_role.
        # jwt_validate_exp off — tokens in tests have no expiry field.
        jwt_secret "nginz-test-secret";
        jwt_validate_exp off;
        jwt_claim $jwt_claim_role role;

        # Access phase: native jwt module rejects missing/invalid tokens (401).
        # Content phase: njs jwt_check reads $jwt_claim_role and applies FP policy (204/403).
        location /jwt-check {
            js_content main.jwt_check;
        }
    }
}
