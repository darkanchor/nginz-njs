daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Simulate $waf_result / $waf_category by reading from request headers.
        # In production the native waf module sets these during the access phase.
        # waf_check only reads these variables — it does not reconstruct
        # deny-path state through error_page redirects.
        location /waf-check {
            set $waf_result   $http_x_waf_result;
            set $waf_category $http_x_waf_category;
            set $waf_rule_id  "0";
            set $waf_score    "0";
            js_content main.waf_check;
        }

        # Simulate $nftset_result / $nftset_matched_set from request headers.
        location /nftset-check {
            set $nftset_result      $http_x_nftset_result;
            set $nftset_matched_set $http_x_nftset_matched_set;
            js_content main.nftset_check;
        }
    }
}
