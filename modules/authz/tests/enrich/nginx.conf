daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Mock OPA endpoints
        location = /__opa-allow {
            default_type application/json;
            return 200 '{"result":{"allow":true}}';
        }
        location = /__opa-deny {
            default_type application/json;
            return 200 '{"result":{"allow":false}}';
        }

        # enriched_check: local method rule + X-Authz-Status header
        location /enriched-check {
            js_content main.enriched_check;
        }

        # enriched_remote_check: OPA decision + X-Authz-Status header
        location /enriched-remote-allow {
            set $authz_opa_url http://127.0.0.1:8888/__opa-allow;
            js_content main.enriched_remote_check;
        }

        location /enriched-remote-deny {
            set $authz_opa_url http://127.0.0.1:8888/__opa-deny;
            js_content main.enriched_remote_check;
        }
    }
}
