daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    keepalive_timeout 0;
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Mock OPA endpoints
        location = /__opa-allow {
            default_type application/json;
            return 200 '{"result":{"allow":true}}';
        }
        location = /__opa-deny {
            default_type application/json;
            return 200 '{"result":{"allow":false}}';
        }

        # enriched_check: local method rule + X-Authz-Status header
        location /enriched-check {
            js_content main.enriched_check;
        }

        # enriched_remote_check: OPA decision + X-Authz-Status header
        location /enriched-remote-allow {
            set $authz_opa_url http://127.0.0.1:8888/__opa-allow;
            js_content main.enriched_remote_check;
        }

        location /enriched-remote-deny {
            set $authz_opa_url http://127.0.0.1:8888/__opa-deny;
            js_content main.enriched_remote_check;
        }

        # Canonical composed policy-shell recipe: simulated JWT + OIDC identity,
        # query extraction via $arg_view, and phase-safe WAF / nftset facts.
        location /enriched-composed-check {
            set $jwt_claim_role      $http_x_jwt_role;
            set $jwt_claim_sub       $http_x_jwt_sub;
            set $oidc_claim_sub      $http_x_oidc_sub;
            set $oidc_claim_email    $http_x_oidc_email;
            set $oidc_claim_name     $http_x_oidc_name;
            set $waf_result          $http_x_waf_result;
            set $waf_category        $http_x_waf_category;
            set $waf_rule_id         $http_x_waf_rule_id;
            set $waf_score           $http_x_waf_score;
            set $nftset_result       $http_x_nftset_result;
            set $nftset_matched_set  $http_x_nftset_matched_set;
            js_content main.enriched_composed_check;
        }
    }
}
