daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";
    js_shared_dict_zone zone=authz_cache:1m timeout=1h;

    js_import main from app.js;

    server {
        listen 8888;

        # Mock OPA endpoints
        location = /__opa-allow {
            default_type application/json;
            return 200 '{"result":{"allow":true}}';
        }

        location = /__opa-deny {
            default_type application/json;
            return 200 '{"result":{"allow":false}}';
        }

        # cached_remote_check — caches OPA decision by Bearer token hash
        location /cached-allow {
            set $authz_opa_url http://127.0.0.1:8888/__opa-allow;
            set $authz_cache_ttl 60;
            js_content main.cached_remote_check;
        }

        location /cached-deny {
            set $authz_opa_url http://127.0.0.1:8888/__opa-deny;
            set $authz_cache_ttl 60;
            js_content main.cached_remote_check;
        }
    }
}
