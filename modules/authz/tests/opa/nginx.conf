daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Mock OPA decision endpoints — static JSON fixtures
        location = /__opa-allow {
            default_type application/json;
            return 200 '{"result":{"allow":true}}';
        }

        location = /__opa-deny {
            default_type application/json;
            return 200 '{"result":{"allow":false}}';
        }

        # remote_check reads $authz_opa_url and POSTs to the OPA endpoint
        location /remote-allow {
            set $authz_opa_url http://127.0.0.1:8888/__opa-allow;
            js_content main.remote_check;
        }

        location /remote-deny {
            set $authz_opa_url http://127.0.0.1:8888/__opa-deny;
            js_content main.remote_check;
        }

        location /remote-no-endpoint {
            js_content main.remote_check;
        }
    }
}
