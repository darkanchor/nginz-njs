daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # General access check — returns 204 (allow) or 403 (deny)
        location /check {
            js_content main.check;
        }

        # JWT claim-based check — reads $jwt_claim_role from nginx JWT module
        location /jwt-check {
            js_content main.jwt_check;
        }
    }
}
