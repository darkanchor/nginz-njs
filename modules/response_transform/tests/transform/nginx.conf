daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";
    js_import main from app.js;

    server {
        listen 8888;

        location /transform {
            js_header_filter main.clear_content_length;
            js_body_filter main.transform buffer_type=string;
            proxy_pass http://127.0.0.1:8889/json;
        }
    }

    server {
        listen 8889;

        location /json {
            add_header Content-Type application/json;
            return 200 '{"user.email":"secret@example.com","internal.trace":"abc123","user.id":"user42","keep":"this"}';
        }
    }
}
