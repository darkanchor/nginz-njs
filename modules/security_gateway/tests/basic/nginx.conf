daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    keepalive_timeout 0;

    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Authenticated JWT — should allow
        location /allow/jwt {
            set $jwt_claim_sub "user-42";
            set $jwt_claim_role "admin";
            js_content main.evaluate_security;
        }

        # Authenticated OIDC — should allow
        location /allow/oidc {
            set $oidc_claim_sub "oidc-user-1";
            set $oidc_claim_email "user@example.test";
            set $oidc_claim_name "Alice";
            js_content main.evaluate_security;
        }

        # No authentication — should deny 401
        location /deny/anonymous {
            js_content main.evaluate_security;
        }

        # Rate limited — should deny 429
        location /deny/ratelimited {
            set $jwt_claim_sub "user-42";
            set $ratelimit_result "denied";
            set $ratelimit_key "127.0.0.1";
            js_content main.evaluate_security;
        }

        # Rate limit allowed — should allow
        location /allow/ratelimit_ok {
            set $jwt_claim_sub "user-42";
            set $ratelimit_result "allowed";
            js_content main.evaluate_security;
        }

        # Challenge — no auth
        location /challenge/anonymous {
            js_content main.challenge_handler;
        }

        # Challenge — has auth
        location /challenge/authenticated {
            set $jwt_claim_sub "user-42";
            js_content main.challenge_handler;
        }

        # With metrics
        location /metrics/allow {
            set $jwt_claim_sub "user-42";
            js_content main.evaluate_with_metrics;
        }
    }
}
