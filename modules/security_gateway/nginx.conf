daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Evaluate all security signals
        location /security/evaluate {
            js_content main.evaluate_security;
        }

        # Evaluate with metrics emission
        location /security/metrics {
            js_content main.evaluate_with_metrics;
        }

        # Challenge handler
        location /security/challenge {
            js_content main.challenge_handler;
        }
    }
}
