daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Basic circuit breaker policy — logs state and returns appropriate status
        location /api/ {
            js_content main.circuit_protected;
        }

        # Circuit breaker with custom fallback body
        location /with-fallback/ {
            js_content main.circuit_with_fallback;
        }

        # Circuit breaker with JSON error response
        location /json-error/ {
            js_content main.circuit_json_error;
        }
    }
}
