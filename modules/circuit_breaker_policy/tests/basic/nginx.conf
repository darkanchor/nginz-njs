daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Simulate closed circuit (native module would set $ngz_circuit_state)
        location /api/closed {
            set $ngz_circuit_state "closed";
            js_content main.circuit_protected;
        }

        # Simulate open circuit
        location /api/open {
            set $ngz_circuit_state "open";
            js_content main.circuit_protected;
        }

        # Simulate half-open circuit
        location /api/half-open {
            set $ngz_circuit_state "half_open";
            js_content main.circuit_protected;
        }

        # Simulate unknown state
        location /api/unknown {
            set $ngz_circuit_state "";
            js_content main.circuit_protected;
        }

        # With fallback — open circuit
        location /fallback/open {
            set $ngz_circuit_state "open";
            js_content main.circuit_with_fallback;
        }

        # With fallback — half-open
        location /fallback/half-open {
            set $ngz_circuit_state "half_open";
            js_content main.circuit_with_fallback;
        }

        # With fallback — closed
        location /fallback/closed {
            set $ngz_circuit_state "closed";
            js_content main.circuit_with_fallback;
        }

        # JSON error — open circuit
        location /json/open {
            set $ngz_circuit_state "open";
            js_content main.circuit_json_error;
        }

        # JSON error — closed circuit
        location /json/closed {
            set $ngz_circuit_state "closed";
            js_content main.circuit_json_error;
        }
    }
}
