daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Simulate canary request (native module would set $ngz_canary)
        location /api/canary {
            set $ngz_canary "1";
            js_content main.canary_routed;
        }

        # Simulate stable request
        location /api/stable {
            set $ngz_canary "0";
            js_content main.canary_routed;
        }

        # Simulate unknown (missing variable)
        location /api/unknown {
            set $ngz_canary "";
            js_content main.canary_routed;
        }

        # Tagged response
        location /tagged/canary {
            set $ngz_canary "1";
            js_content main.canary_tagged;
        }

        location /tagged/stable {
            set $ngz_canary "0";
            js_content main.canary_tagged;
        }

        # With metrics
        location /metrics/canary {
            set $ngz_canary "1";
            js_content main.canary_with_metrics;
        }
    }
}
