daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Canary routing with header injection
        location /api/ {
            js_content main.canary_routed;
        }

        # Canary-aware response tagging
        location /tagged/ {
            js_content main.canary_tagged;
        }

        # Canary with metrics emission
        location /metrics/ {
            js_content main.canary_with_metrics;
        }
    }
}
