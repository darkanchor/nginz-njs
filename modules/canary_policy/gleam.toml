name = "nginz_njs_canary_policy"
version = "0.1.0"
target = "javascript"
description = "Scripted canary routing policy: header injection, feature flag integration, session-sticky canary, and metrics for the native canary module"

licences = ["Apache-2.0"]
gleam = ">= 1.14.0"

[dependencies]
gleam_stdlib = ">= 0.39.0 and < 2.0.0"
gleam_javascript = ">= 0.11.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
ngs = ">= 1.0.8 and < 2.0.0"
nginz_njs_metrics = { path = "../metrics" }
nginz_njs_session = { path = "../session" }
nginz_njs_feature_flags = { path = "../feature_flags" }
nginz_njs_response_transform = { path = "../response_transform" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.native]
nginz = ["canary"]
