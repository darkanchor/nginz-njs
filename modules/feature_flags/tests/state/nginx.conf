daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";
    js_shared_dict_zone zone=ff_state:1m timeout=1h;

    js_import main from app.js;

    server {
        listen 8888;

        # Persist a flag to the shared dict.
        # Query params: ?name=<flag>&enabled=<0|1>&pct=<0-100>
        location /set-flag {
            set $ff_state_dict ff_state;
            js_content main.set_flag;
        }

        # Evaluate a boolean flag: tries shared dict first, falls back to nginx vars.
        location /evaluate {
            set $ff_name       test_flag;
            set $ff_state_dict ff_state;
            set $ff_key_type   user_id;
            set $ff_key        user_42;
            js_content main.evaluate;
        }
    }
}
