daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Header-based canary: X-Canary: true → ForceOn; absent → NoOverride
        # Flag has pct=0 so it would normally be off for every request
        location /flag/canary-header {
            canary_header X-Canary true;
            set $ff_name          "beta";
            set $ff_key_type      "request_id";
            set $ff_key           $arg_id;
            set $ff_beta_enabled  "1";
            set $ff_beta_pct      "0";
            js_content main.evaluate_canary;
        }

        # Percentage-based: 100% to canary — always ForceOn
        location /flag/canary-pct {
            canary_percentage 100;
            set $ff_name          "beta";
            set $ff_key_type      "request_id";
            set $ff_key           $arg_id;
            set $ff_beta_enabled  "1";
            set $ff_beta_pct      "0";
            js_content main.evaluate_canary;
        }

        # describe_canary: annotates decision with canary=1 or canary=0
        location /flag/describe-canary {
            canary_header X-Canary true;
            set $ff_name          "beta";
            set $ff_key_type      "request_id";
            set $ff_key           $arg_id;
            set $ff_beta_enabled  "1";
            set $ff_beta_pct      "0";
            js_content main.describe_canary;
        }
    }
}
