daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # OIDC-gated bucket endpoint.
        # The oidc module sets $oidc_claim_sub in the ACCESS phase; the handler
        # uses that validated subject for bucketing.
        location /bucket/oidc {
            oidc on;
            oidc_discovery /home/kaiwu/Documents/gitea/nginz-njs/modules/feature_flags/tests/oidc/discovery.json;
            oidc_allow_insecure_http on;
            oidc_client_id test-client;
            oidc_client_secret test-secret;
            oidc_redirect_uri http://localhost:8888/callback;
            oidc_cookie_secret 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef;
            set $ff_key_type oidc_sub;
            set $ff_key $arg_fallback;
            js_content main.bucket;
        }

        # Direct user_id bucket for comparison: same key string, same hash.
        location /bucket/user {
            set $ff_key_type user_id;
            set $ff_key $arg_id;
            js_content main.bucket;
        }

        location /callback {
            oidc on;
            oidc_discovery /home/kaiwu/Documents/gitea/nginz-njs/modules/feature_flags/tests/oidc/discovery.json;
            oidc_allow_insecure_http on;
            oidc_client_id test-client;
            oidc_client_secret test-secret;
            oidc_redirect_uri http://localhost:8888/callback;
            oidc_cookie_secret 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef;
        }
    }
}
