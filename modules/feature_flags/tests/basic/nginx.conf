daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;
    js_var $ff_name "test";
    js_var $ff_key_type "request_id";
    js_var $ff_key "js-set-user";
    js_var $ff_test_pct "100";
    js_set $js_set_test_result main.evaluate_js_set;

    map $uri $ff_test_enabled {
        /flag/js-set-on  "1";
        /flag/js-set-off "0";
        default          "0";
    }

    server {
        listen 8888;

        # stable bucket for a fixed key — used to predict flag outcome in tests
        location /bucket {
            set $ff_key_type "request_id";
            set $ff_key      $arg_id;
            js_content main.bucket;
        }

        location /bucket/user-id {
            set $ff_key_type "user_id";
            set $ff_key      $arg_id;
            js_content main.bucket;
        }

        location /bucket/remote-addr {
            set $ff_key_type "remote_addr";
            set $ff_key      $arg_id;
            js_content main.bucket;
        }

        # fully enabled flag
        location /flag/on {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            js_content main.evaluate;
        }

        # fully disabled flag
        location /flag/off {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "0";
            set $ff_test_pct           "100";
            js_content main.evaluate;
        }

        # force-on override defeats disabled flag
        location /flag/force-on {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "0";
            set $ff_test_pct           "0";
            set $ff_test_override      "on";
            js_content main.evaluate;
        }

        # force-off override defeats enabled flag
        location /flag/force-off {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            set $ff_test_override      "off";
            js_content main.evaluate;
        }

        # variant flag — A/B/C with weighted distribution
        location /flag/variant {
            set $ff_name               "exp";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_exp_enabled        "1";
            set $ff_exp_variants       "A:40,B:40,C:20";
            set $ff_exp_fallback       "control";
            js_content main.variant;
        }

        # variant flag with force-on override
        location /flag/variant-force-on {
            set $ff_name               "exp";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_exp_enabled        "0";
            set $ff_exp_variants       "A:100";
            set $ff_exp_fallback       "control";
            set $ff_exp_override       "on";
            js_content main.variant;
        }

        # describe — boolean flag decision metadata
        location /flag/describe {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            js_content main.describe;
        }

        # describe_variant — variant flag decision metadata
        location /flag/describe-variant {
            set $ff_name               "exp";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_exp_enabled        "1";
            set $ff_exp_variants       "B:100";
            set $ff_exp_fallback       "control";
            js_content main.describe_variant;
        }

        location /flag/js-set-on {
            return 200 $js_set_test_result;
        }

        location /flag/js-set-off {
            return 200 $js_set_test_result;
        }

        # OIDC bucket: $ff_oidc_sub is the bridge variable set by admin from any identity source
        location /bucket/oidc {
            set $ff_key_type  "oidc_sub";
            set $ff_oidc_sub  $arg_sub;
            set $ff_key       $arg_sub;
            js_content main.bucket;
        }

        # OIDC flag evaluation: resolves ByUserId from $ff_oidc_sub
        location /flag/oidc {
            set $ff_name         "test";
            set $ff_key_type     "oidc_sub";
            set $ff_oidc_sub     $arg_sub;
            set $ff_key          $arg_sub;
            set $ff_test_enabled "1";
            set $ff_test_pct     "100";
            js_content main.evaluate;
        }
    }
}
