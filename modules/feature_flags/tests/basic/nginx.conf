daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # stable bucket for a fixed key — used to predict flag outcome in tests
        location /bucket {
            set $ff_key_type "request_id";
            set $ff_key      $arg_id;
            js_content main.bucket;
        }

        # fully enabled flag
        location /flag/on {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            js_content main.evaluate;
        }

        # fully disabled flag
        location /flag/off {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "0";
            set $ff_test_pct           "100";
            js_content main.evaluate;
        }
    }
}
