daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # stable bucket for a fixed key — used to predict flag outcome in tests
        location /bucket {
            set $ff_key_type "request_id";
            set $ff_key      $arg_id;
            js_content main.bucket;
        }

        # fully enabled flag
        location /flag/on {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            js_content main.evaluate;
        }

        # fully disabled flag
        location /flag/off {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "0";
            set $ff_test_pct           "100";
            js_content main.evaluate;
        }

        # force-on override defeats disabled flag
        location /flag/force-on {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "0";
            set $ff_test_pct           "0";
            set $ff_test_override      "on";
            js_content main.evaluate;
        }

        # force-off override defeats enabled flag
        location /flag/force-off {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            set $ff_test_override      "off";
            js_content main.evaluate;
        }

        # variant flag — A/B/C with weighted distribution
        location /flag/variant {
            set $ff_name               "exp";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_exp_enabled        "1";
            set $ff_exp_variants       "A:40,B:40,C:20";
            set $ff_exp_fallback       "control";
            js_content main.variant;
        }

        # variant flag with force-on override
        location /flag/variant-force-on {
            set $ff_name               "exp";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_exp_enabled        "0";
            set $ff_exp_variants       "A:100";
            set $ff_exp_fallback       "control";
            set $ff_exp_override       "on";
            js_content main.variant;
        }

        # describe — boolean flag decision metadata
        location /flag/describe {
            set $ff_name               "test";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_test_enabled       "1";
            set $ff_test_pct           "100";
            js_content main.describe;
        }

        # describe_variant — variant flag decision metadata
        location /flag/describe-variant {
            set $ff_name               "exp";
            set $ff_key_type           "request_id";
            set $ff_key                $arg_id;
            set $ff_exp_enabled        "1";
            set $ff_exp_variants       "B:100";
            set $ff_exp_fallback       "control";
            js_content main.describe_variant;
        }
    }
}
