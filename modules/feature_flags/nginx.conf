daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    # flag config via nginx variables — set these per-location or via map blocks
    js_var $ff_name         "";
    js_var $ff_key_type     "request_id";
    js_var $ff_key          "";

    # per-flag config: ff_<name>_enabled and ff_<name>_pct
    js_var $ff_dark_mode_enabled  "1";
    js_var $ff_dark_mode_pct      "50";

    server {
        listen 8888;

        # returns "1" (enabled) or "0" (disabled) for the named flag
        location /flags/evaluate {
            set $ff_name $arg_flag;
            set $ff_key  $request_id;
            js_content main.evaluate;
        }

        # returns the stable bucket number (0-99) for the request
        location /flags/bucket {
            set $ff_key $request_id;
            js_content main.bucket;
        }
    }
}
