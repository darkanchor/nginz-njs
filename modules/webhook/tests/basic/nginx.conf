daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        location /describe-outbound {
            js_content main.describe_outbound;
        }

        location /describe-inbound {
            js_content main.describe_inbound;
        }

        location /sign-demo {
            js_content main.sign_demo;
        }

        location /verify-demo {
            js_content main.verify_demo;
        }

        location /signed-fixture {
            js_content main.signed_fixture;
        }
    }
}
