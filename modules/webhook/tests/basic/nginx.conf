daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        location /describe-outbound {
            js_content main.describe_outbound;
        }

        location /describe-inbound {
            js_content main.describe_inbound;
        }

        location /sign-demo {
            js_content main.sign_demo;
        }

        location /verify-demo {
            js_content main.verify_demo;
        }

        location /signed-fixture {
            js_content main.signed_fixture;
        }

        location /deliver-demo {
            set $webhook_demo_url http://127.0.0.1:8889/__fixture/upstream;
            js_content main.deliver_demo;
        }

        location /deliver-demo-fail {
            set $webhook_demo_url http://127.0.0.1:8890/__fixture/upstream;
            set $webhook_demo_timeout_ms 100;
            set $webhook_demo_retry_max_attempts 0;
            js_content main.deliver_demo;
        }
    }

    server {
        listen 8889;

        location = /__fixture/upstream {
            default_type application/json;
            return 202 '{"delivered":true}';
        }
    }
}
