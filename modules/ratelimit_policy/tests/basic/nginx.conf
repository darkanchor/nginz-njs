daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    # -----------------------------------------------------------------------
    # INTEGRATION TEST CONFIG — simulated variables only, no native module.
    #
    # These tests exercise the js_content handlers directly by setting
    # $ratelimit_result via the nginx "set" directive instead of running
    # the native ratelimit module. This is the correct pattern for testing
    # handler logic without native dependencies.
    #
    # Values match the native module's actual output: "allow" / "deny".
    # In production, the native ratelimit module runs in ACCESS phase and
    # returns 429 on deny — the js_content handlers never execute at the
    # same location. Wire them through "error_page 429 = @name;" instead.
    # See the module README.md for production configuration patterns.
    # -----------------------------------------------------------------------

    server {
        listen 8888;

        # Simulate ratelimit variables for testing without native module
        location /api/allowed {
            set $ratelimit_result "allow";
            set $ratelimit_key "192.168.1.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "1";
            js_content main.rate_limited;
        }

        location /api/denied {
            set $ratelimit_result "deny";
            set $ratelimit_key "192.168.1.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            js_content main.rate_limited;
        }

        location /api/unknown {
            set $ratelimit_result "";
            set $ratelimit_key "";
            set $ratelimit_source "";
            set $ratelimit_cost "";
            js_content main.rate_limited;
        }

        location /headers/allowed {
            set $ratelimit_result "allow";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "1";
            js_content main.rate_limited_with_headers;
        }

        location /headers/denied {
            set $ratelimit_result "deny";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            js_content main.rate_limited_with_headers;
        }

        location /custom/denied {
            set $ratelimit_result "deny";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            js_content main.rate_limited_custom_error;
        }

        location /fallback/denied {
            set $ratelimit_result "deny";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            set $ratelimit_fallback_path "/internal/degraded";
            js_content main.rate_limited_with_fallback;
        }
    }
}
