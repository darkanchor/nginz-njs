daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Simulate ratelimit variables for testing without native module
        # In production, the native ratelimit module sets these
        location /api/allowed {
            set $ratelimit_result "allowed";
            set $ratelimit_key "192.168.1.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "1";
            js_content main.rate_limited;
        }

        location /api/denied {
            set $ratelimit_result "denied";
            set $ratelimit_key "192.168.1.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            js_content main.rate_limited;
        }

        location /api/unknown {
            set $ratelimit_result "";
            set $ratelimit_key "";
            set $ratelimit_source "";
            set $ratelimit_cost "";
            js_content main.rate_limited;
        }

        location /headers/allowed {
            set $ratelimit_result "allowed";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "1";
            js_content main.rate_limited_with_headers;
        }

        location /headers/denied {
            set $ratelimit_result "denied";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            js_content main.rate_limited_with_headers;
        }

        location /custom/denied {
            set $ratelimit_result "denied";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            js_content main.rate_limited_custom_error;
        }

        location /fallback/denied {
            set $ratelimit_result "denied";
            set $ratelimit_key "10.0.0.1";
            set $ratelimit_source "ip";
            set $ratelimit_cost "5";
            set $ratelimit_fallback_path "/internal/degraded";
            js_content main.rate_limited_with_fallback;
        }
    }
}
