worker_processes 2;
daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";
    js_import main from app.js;

    server {
        listen 8888;

        # -------------------------------------------------------------------
        # NATIVE INTEGRATION TEST — real native ratelimit module.
        #
        # The native ratelimit module runs in ACCESS phase and returns 429
        # when the limit is exceeded. error_page catches it and redirects to
        # an internal named location where js_content renders a custom error.
        # -------------------------------------------------------------------

        # --- Pattern A: Custom JSON error on deny ---
        #
        # echozn is a CONTENT-phase handler — runs AFTER ACCESS phase
        # where the native ratelimit module makes its decision. Never use
        # "return" here (REWRITE phase, before ACCESS — skips ratelimit).
        location /api/ {
            ratelimit_rate 2r/s;
            ratelimit_key $remote_addr;
            error_page 429 = @rate_limited;
            echozn "ok";
        }

        location @rate_limited {
            internal;
            js_content main.rate_limited_custom_error;
        }

        # --- Pattern B: Rate limit headers on deny ---
        location /headers/ {
            ratelimit_rate 2r/s;
            ratelimit_key $remote_addr;
            error_page 429 = @rate_limited_headers;
            echozn "ok";
        }

        location @rate_limited_headers {
            internal;
            js_content main.rate_limited_with_headers;
        }

        # --- Pattern C: Basic handler (status only, no custom body) ---
        location /basic/ {
            ratelimit_rate 2r/s;
            ratelimit_key $remote_addr;
            error_page 429 = @rate_limited_basic;
            echozn "ok";
        }

        location @rate_limited_basic {
            internal;
            js_content main.rate_limited;
        }

        # --- Non-rate-limited fallback ---
        location / {
            return 200 "ok\n";
        }
    }
}
