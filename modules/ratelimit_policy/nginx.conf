daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    # Shared dict for rate limit counters (required by native ratelimit module)
    # js_shared_dict_zone zone=ratelimit_zone:1m timeout=1h;

    server {
        listen 8888;

        # -------------------------------------------------------------------
        # Pattern A: Custom error on deny + proxy_pass on allow (recommended)
        #
        # Native ratelimit (ACCESS phase) returns 429 on deny.
        # error_page 429 = @rate_limited catches it and redirects to the
        # internal named location where js_content renders a custom error.
        # Allowed requests flow through to proxy_pass.
        #
        # IMPORTANT: Never use "return" as the content handler — it runs in
        # REWRITE phase (before ACCESS) and skips the native ratelimit
        # handler. Use proxy_pass, echozn, or another CONTENT-phase handler.
        # -------------------------------------------------------------------
        location /api/ {
            # ratelimit_rate "100r/s";      # uncomment with native module
            # ratelimit_burst "50";
            # ratelimit_key "$remote_addr";

            error_page 429 = @rate_limited;

            # proxy_pass http://backend;
            echozn "ok";  # placeholder CONTENT handler — replace with proxy_pass
        }

        location @rate_limited {
            internal;
            js_content main.rate_limited_custom_error;
        }

        # -------------------------------------------------------------------
        # Pattern B: Standalone with headers (no proxy_pass)
        # -------------------------------------------------------------------
        location /with-headers/ {
            # Native directives go here when using the native module
            error_page 429 = @rate_limited_headers;
            echozn "ok";
        }

        location @rate_limited_headers {
            internal;
            js_content main.rate_limited_with_headers;
        }

        # -------------------------------------------------------------------
        # Pattern C: Standalone with custom JSON error
        # -------------------------------------------------------------------
        location /custom-error/ {
            error_page 429 = @rate_limited_custom;
            echozn "ok";
        }

        location @rate_limited_custom {
            internal;
            js_content main.rate_limited_custom_error;
        }

        # -------------------------------------------------------------------
        # Pattern D: Standalone with workflow fallback on deny
        # -------------------------------------------------------------------
        location /with-fallback/ {
            error_page 429 = @rate_limited_fallback;
            echozn "ok";
        }

        location @rate_limited_fallback {
            internal;
            js_content main.rate_limited_with_fallback;
        }
    }
}
