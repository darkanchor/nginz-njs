daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    # Shared dict for rate limit counters (required by native ratelimit module)
    # js_shared_dict_zone zone=ratelimit_zone:1m timeout=1h;

    server {
        listen 8888;

        # Rate-limited endpoint — native ratelimit decides, scripted policy shapes response
        location /api/ {
            # Native ratelimit directives (require make with nginz modules)
            # ratelimit_rate "100r/s";
            # ratelimit_burst "50";
            # ratelimit_key "$remote_addr";

            js_content main.rate_limited;
        }

        # Rate limit headers only — pass-through with header injection
        location /with-headers/ {
            js_content main.rate_limited_with_headers;
        }

        # Rate-limited with custom JSON error body
        location /custom-error/ {
            js_content main.rate_limited_custom_error;
        }

        # Rate-limited with workflow fallback on deny
        location /with-fallback/ {
            js_content main.rate_limited_with_fallback;
        }
    }
}
