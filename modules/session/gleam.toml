name = "nginz_njs_session"
version = "0.1.0"
target = "javascript"
description = "Session-state scaffold for nginx: reusable session modeling with shared_dict-backed runtime deferred"

licences = ["Apache-2.0"]
gleam = ">= 1.14.0"

[dependencies]
gleam_stdlib = ">= 0.39.0 and < 2.0.0"
gleam_javascript = ">= 0.11.0 and < 2.0.0"
ngs = ">= 1.0.8 and < 2.0.0"
nginz_njs_mlcache = { path = "../mlcache" }
nginz_njs_metrics = { path = "../metrics" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.native]
nginz = ["oidc"]
