daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";
    js_shared_dict_zone zone=sessions:1m timeout=1h;

    js_import main from app.js;

    server {
        listen 8888;

        set $session_dict sessions;
        set $session_ttl 3600;

        # OIDC-gated session start: oidc module validates in ACCESS phase,
        # then start_oidc reads the validated subject.
        location /session/start {
            oidc on;
            oidc_discovery /home/kaiwu/Documents/gitea/nginz-njs/modules/session/tests/oidc/discovery.json;
            oidc_allow_insecure_http on;
            oidc_client_id test-client;
            oidc_client_secret test-secret;
            oidc_redirect_uri http://localhost:8888/callback;
            oidc_cookie_secret 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef;
            js_content main.start_oidc;
        }

        location /callback {
            oidc on;
            oidc_discovery /home/kaiwu/Documents/gitea/nginz-njs/modules/session/tests/oidc/discovery.json;
            oidc_allow_insecure_http on;
            oidc_client_id test-client;
            oidc_client_secret test-secret;
            oidc_redirect_uri http://localhost:8888/callback;
            oidc_cookie_secret 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef;
        }

        location /session/verify {
            js_content main.verify;
        }

        location /session/end {
            js_content main.end_session;
        }
    }
}
