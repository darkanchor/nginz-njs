daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Simulate requestid variable (native module would set $ngz_request_id)
        location /api/ {
            set $ngz_request_id "test-request-123";
            js_content main.traced;
        }

        # With structured log emission
        location /log/ {
            set $ngz_request_id "test-request-456";
            js_content main.traced_with_log;
        }

        # With session correlation
        location /correlated/ {
            set $ngz_request_id "test-request-789";
            js_content main.traced_with_session;
        }
    }
}
