daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Native requestid module drives $ngz_request_id; njs echoes it through
        # request_tracing headers. Keep native response header emission off so
        # assertions exercise the scripted adapter path directly.
        location /api/ {
            request_id_response off;
            js_content main.traced;
        }

        location /log/ {
            request_id_response off;
            js_content main.traced_with_log;
        }

        location /correlated/ {
            request_id_response off;
            js_content main.traced_with_session;
        }
    }
}
