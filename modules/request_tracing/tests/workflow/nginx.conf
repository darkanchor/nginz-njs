daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # traced_workflow: parallel subrequests with span recording
        location /workflow/ {
            set $ngz_request_id "trace-workflow-001";
            js_content main.traced_workflow;
        }

        location /traced-enrich/ {
            set $ngz_request_id "trace-enrich-001";
            set $profile_status 200;
            js_content main.traced_enrich;
        }

        location /traced-enrich-failing/ {
            set $ngz_request_id "trace-enrich-failing-001";
            set $profile_status 500;
            js_content main.traced_enrich;
        }

        location /traced-enrich-transport-failing/ {
            set $ngz_request_id "trace-enrich-transport-failing-001";
            set $profile_status 200;
            set $trace_fail_transport_url "http://127.0.0.1:1/";
            js_content main.traced_enrich;
        }

        # Health endpoint used as the subrequest target
        location /health {
            return 200 "ok";
        }

        location /internal/auth {
            internal;
            return 200 "ok";
        }

        location /internal/profile {
            internal;
            if ($profile_status = 500) {
                return 500 "profile failed";
            }
            return 200 "alice";
        }
    }
}
