name = "nginz_njs_request_tracing"
version = "0.1.0"
target = "javascript"
description = "Distributed tracing glue: request ID propagation, span recording, and structured trace emission for the native requestid module"

licences = ["Apache-2.0"]
gleam = ">= 1.14.0"

[dependencies]
gleam_stdlib = ">= 0.39.0 and < 2.0.0"
gleam_javascript = ">= 0.11.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
ngs = ">= 1.0.8 and < 2.0.0"
nginz_njs_http_client = { path = "../http_client" }
nginz_njs_metrics = { path = "../metrics" }
nginz_njs_workflow = { path = "../workflow" }
nginz_njs_session = { path = "../session" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.native]
nginz = ["requestid"]
