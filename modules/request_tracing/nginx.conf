daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Propagate request ID to upstream headers
        location /api/ {
            js_content main.traced;
        }

        # Structured trace log emission
        location /log/ {
            js_content main.traced_with_log;
        }

        # Request ID with session correlation
        location /correlated/ {
            js_content main.traced_with_session;
        }
    }
}
