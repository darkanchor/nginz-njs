daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # All backends healthy
        location /health/all-healthy {
            set $health_backends "api=healthy,db=healthy";
            js_content main.aggregate_health;
        }

        # All backends unhealthy
        location /health/all-unhealthy {
            set $health_backends "api=unhealthy,db=unhealthy";
            js_content main.aggregate_health;
        }

        # Degraded — one healthy, one not
        location /health/degraded {
            set $health_backends "api=healthy,db=unhealthy";
            js_content main.aggregate_health;
        }

        # No backends configured
        location /health/empty {
            set $health_backends "";
            js_content main.aggregate_health;
        }

        # Readiness gate — healthy backends
        location /gate/healthy {
            set $health_backends "api=healthy";
            js_content main.readiness_gate;
        }

        # Readiness gate — all unhealthy
        location /gate/unhealthy {
            set $health_backends "api=unhealthy,db=unhealthy";
            js_content main.readiness_gate;
        }

        # Custom health
        location /custom/healthy {
            set $health_backends "api=healthy,db=healthy";
            js_content main.custom_health;
        }

        # Custom health — unhealthy
        location /custom/unhealthy {
            set $health_backends "api=unhealthy";
            js_content main.custom_health;
        }
    }
}
