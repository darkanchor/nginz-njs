daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Health aggregation endpoint
        location /health/aggregate {
            js_content main.aggregate_health;
        }

        # Readiness gate — returns 503 if backend is unhealthy
        location /api/ {
            js_content main.readiness_gate;
        }

        # Custom health response combining multiple signals
        location /health/custom {
            js_content main.custom_health;
        }
    }
}
