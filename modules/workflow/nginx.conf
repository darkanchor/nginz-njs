daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Fan-out: parallel subrequests to /internal/auth and /internal/profile
        location /enrich {
            js_content main.enrich;
        }

        # Chain: single subrequest to /internal/upstream
        location /chain {
            js_content main.chain;
        }

        # Fetch chain: external HTTP through http_client
        location /fetch-chain {
            js_content main.fetch_chain;
        }

        # Sequential: two subrequests in order
        location /sequential {
            js_content main.sequential;
        }

        # Retry: subrequest with retry wrapper
        location /retry {
            js_content main.retry;
        }

        # Timeout: subrequest with 10ms timeout
        location /timeout {
            js_content main.timeout;
        }

        # Recover: subrequest with fallback
        location /recover-demo {
            js_content main.recover_demo;
        }

        # First-ok: parallel, return first success
        location /first-ok-demo {
            js_content main.first_ok_demo;
        }

        # Map-body: transform response body
        location /map-body-demo {
            js_content main.map_body_demo;
        }

        # Summary: pipeline debug info
        location /summary {
            js_content main.summary;
        }

        # Internal upstream stubs
        location /internal/ {
            internal;
            return 200 "stub";
        }
    }
}
