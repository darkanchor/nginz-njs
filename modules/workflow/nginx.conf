daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Fan-out: calls /internal/auth and /internal/profile in parallel,
        # combines and returns when both succeed.
        location /enrich {
            js_content main.enrich;
        }

        # Chain: calls /internal/upstream and proxies its response.
        location /chain {
            js_content main.chain;
        }

        # Internal upstream stubs — replace with real upstreams.
        location /internal/ {
            internal;
            return 200 "stub";
        }
    }
}
