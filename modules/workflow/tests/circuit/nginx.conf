daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Reads $ngz_circuit_state and returns it as plain text.
        # High threshold so this circuit never trips during tests.
        location /circuit/state {
            circuit_breaker_threshold 10;
            js_content main.circuit_state;
        }

        # Always delegates to /internal/sick (500); used to trip the circuit.
        # threshold=2 opens after 2 failures; timeout=100 transitions to
        # half_open after 100 ms.
        location /circuit/trip {
            circuit_breaker_threshold 2;
            circuit_breaker_timeout 100;
            js_content main.circuit_trip;
        }

        # Healthy probe using allow_probe_when_half_open.
        # Pass ?fail=1 to simulate failure and trip the circuit.
        # success_threshold=1 closes the circuit after a single probe success.
        location /circuit/probe {
            circuit_breaker_threshold 2;
            circuit_breaker_timeout 100;
            circuit_breaker_success_threshold 1;
            js_content main.circuit_probe;
        }

        location /internal/healthy {
            internal;
            echozn 'healthy';
        }

        location /internal/sick {
            internal;
            return 500;
        }
    }
}
