daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # njs fan-out: subrequests to /internal/auth and /internal/profile in parallel,
        # combines their bodies, returns 200 or 502 if either backend fails.
        location /enrich {
            js_content main.enrich;
        }

        # Native echoz module serves these internal backends — no upstream process needed.
        location /internal/auth {
            internal;
            echozn '{"ok":true}';
        }

        location /internal/profile {
            internal;
            echozn '{"name":"alice","id":1}';
        }
    }
}
