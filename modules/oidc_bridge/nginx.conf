daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Bind OIDC identity to session
        location /oidc/bind {
            js_content main.bind_session;
        }

        # Map OIDC claims to authz claims dict
        location /oidc/claims {
            js_content main.map_claims;
        }

        # Resolve OIDC subject to feature flag key
        location /oidc/flag-key {
            js_content main.resolve_flag_key;
        }
    }
}
