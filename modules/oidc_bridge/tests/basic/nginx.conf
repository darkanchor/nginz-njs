daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    keepalive_timeout 0;

    js_engine qjs;
    js_path "njs/";

    js_import main from app.js;

    server {
        listen 8888;

        # Full OIDC identity
        location /oidc/full {
            set $oidc_claim_sub "user-42";
            set $oidc_claim_email "alice@example.test";
            set $oidc_claim_name "Alice";
            js_content main.bind_session;
        }

        # Minimal OIDC — only sub
        location /oidc/minimal {
            set $oidc_claim_sub "user-99";
            js_content main.bind_session;
        }

        # Map claims to authz dict
        location /oidc/map {
            set $oidc_claim_sub "user-42";
            set $oidc_claim_email "alice@example.test";
            set $oidc_claim_name "Alice";
            js_content main.map_claims;
        }

        # Resolve feature flag key
        location /oidc/flag {
            set $oidc_claim_sub "user-42";
            js_content main.resolve_flag_key;
        }

        # Missing OIDC claims — defaults to unknown
        location /oidc/missing {
            js_content main.bind_session;
        }
    }
}
